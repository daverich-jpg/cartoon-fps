<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Block Blast</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Palette. Environment = muted/warm; secondary = props & buildings; accents carry gameplay meaning:
   tangerine = enemies only, gold = the Wishing Star (objective), blue = the player. */
:root{
  --ink:#2a1830;--line:#4b3658;
  --sky:#9fd0ea;--haze:#f3d9cc;--grass:#a9cc7e;--cream:#fff1c9;--lav:#b9a6dc;--pink:#eba3b4;--teal:#72c0b6;
  --mint:#9fd08a;--coral:#f0604c;--gold:#ffc53d;--tangerine:#ff7a2c;--player:#2f9be0;
  box-sizing:border-box;color-scheme:light}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--sky);font-family:'Fredoka',system-ui,sans-serif;color:#fff;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#look{position:fixed;inset:0}
.hud{position:fixed;pointer-events:none;font-weight:700;text-shadow:-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),2px 2px 0 var(--ink),0 4px 0 var(--ink)}
#top{top:calc(10px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));right:calc(14px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;font-size:19px}
#life{display:flex;align-items:center;gap:6px;width:46%;max-width:340px}
#life svg{flex:none;width:34px;height:34px;filter:drop-shadow(0 3px 0 var(--ink))}
#bar{flex:1;height:24px;background:var(--cream);border-radius:99px;overflow:hidden;border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#hp{height:100%;width:100%;background:var(--mint);border-radius:99px;transition-property:width,background-color;transition-duration:.15s;box-shadow:inset 0 -5px 0 #0002,inset 0 4px 0 #fff6}
#info{background:var(--cream);color:var(--ink);text-shadow:none;border:4px solid var(--ink);border-radius:99px;padding:3px 14px;box-shadow:0 4px 0 var(--ink);font-variant-numeric:tabular-nums}
#right{display:flex;align-items:center;gap:8px}
#snd{pointer-events:auto;width:40px;height:40px;padding:0;border-radius:50%;background:var(--cream);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;cursor:pointer}
#snd svg{width:22px;height:22px;grid-area:1/1}#snd .x,#snd.off .on{display:none}#snd.off .x{display:block}
#snd:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#cross{top:50%;left:50%;width:24px;height:24px;margin:-12px;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--ink);text-shadow:none;transition-property:transform,border-color;transition-duration:.09s;transition-timing-function:cubic-bezier(.2,0,0,1)}
#cross.hit{border-color:var(--tangerine);transform:scale(1.6)}
#stick{position:fixed;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:128px;height:128px;border-radius:50%;background:#fff1c966;border:5px solid var(--ink)}
#knob{position:absolute;left:34px;top:34px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 58%,var(--ink) 0 9px,transparent 10px),var(--gold);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#fire{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:108px;height:108px;border-radius:50%;background:linear-gradient(#6cc4f5,var(--player));border:5px solid var(--ink);box-shadow:0 7px 0 var(--ink),inset 0 -8px 0 #0002;color:#fff;font:700 26px 'Fredoka',sans-serif;text-shadow:0 3px 0 var(--ink)}
#fire:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
#hint{bottom:calc(36px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--cream);color:var(--ink);text-shadow:none;border:4px solid var(--ink);border-radius:99px;padding:6px 16px;box-shadow:0 4px 0 var(--ink);font-size:16px;white-space:nowrap;display:none}
#hint.on{display:block}
.desk{display:none}@media (pointer:fine){.desk{display:inline}.touch{display:none}}
#banner{top:26%;left:0;right:0;text-align:center;font-size:44px}
#banner.on{animation:pop .5s cubic-bezier(.16,1,.3,1)}
@keyframes pop{from{transform:scale(.4) translateY(10px);opacity:0}}
#hurt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,#f0604c99 100%);opacity:0;transition:opacity .35s ease-out}
#hurt.on{opacity:1;transition-duration:.05s}
/* Overlays let the living world show through instead of hiding it behind a flat gradient */
.ov{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#2a183000 25%,#2a183080 100%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.ov.on{display:flex}
.ov.on>*{animation:rise .55s cubic-bezier(.16,1,.3,1) backwards}
.ov.on>:nth-child(2){animation-delay:.1s}.ov.on>:nth-child(3){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ov h1{font-size:min(54px,11.5vw);white-space:nowrap;margin:0;color:var(--cream);text-shadow:-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 3px 0 var(--ink),0 8px 0 var(--ink)}
.ov h1::before,.ov h1::after{content:'★';color:var(--gold);font-size:.55em;margin:0 8px;vertical-align:middle}
.ov p{margin:0;max-width:320px;font-size:18px;color:var(--ink);background:var(--cream);border:4px solid var(--ink);border-radius:20px;padding:12px 16px;box-shadow:0 5px 0 var(--ink)}
.ov button{font:700 24px 'Fredoka',sans-serif;background:linear-gradient(#ffd96a,var(--gold));color:var(--ink);border:5px solid var(--ink);border-radius:99px;padding:12px 38px;box-shadow:0 7px 0 var(--ink)}
.ov button:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
@media (max-height:420px){.ov{gap:12px}.ov h1{font-size:42px}.ov p{font-size:16px;padding:9px 14px}}
@media (prefers-reduced-motion:reduce){.ov.on>*,#banner.on{animation:none}}
</style></head><body>
<canvas id="c"></canvas><div id="look"></div>
<div id="hurt"></div>
<div class="hud" id="top"><div id="life"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M17 30C8 23 3 18 3 11.5 3 7 6.5 4 10.5 4c3 0 5 1.6 6.5 4 1.5-2.4 3.5-4 6.5-4C27.5 4 31 7 31 11.5 31 18 26 23 17 30z" fill="#f0604c" stroke="#2a1830" stroke-width="3.5" stroke-linejoin="round"/><path d="M9 9.5c1-1.6 2.6-2 4-1.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg><div id="bar"><div id="hp"></div></div></div><div id="right"><div id="info">Wave 1 · 0 KO</div><button id="snd" aria-label="Mute sound" aria-pressed="false"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z" fill="#2a1830" stroke="#2a1830" stroke-width="2" stroke-linejoin="round"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="#2a1830" stroke-width="2.4" stroke-linecap="round"/></svg><svg class="x" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3l5-4v14l-5-4H4z" fill="#2a1830" stroke="#2a1830" stroke-width="2" stroke-linejoin="round"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="#f0604c" stroke-width="2.6" stroke-linecap="round"/></svg></button></div></div>

<div id="stick"><div id="knob"></div></div>
<button id="fire">FIRE</button>
<div class="ov on" id="intro"><h1>Block Blast</h1><p><span class="touch">Left thumb walks, drag the right side to aim, tap FIRE.</span><span class="desk">WASD walks, mouse aims, click or Space fires. Esc frees the mouse.</span> Pop the big goofy heads for double damage!</p><button id="start">Play</button></div>
<div class="ov" id="over"><h1>Oof!</h1><p id="score"></p><button id="again">Play again</button></div>
<script>

  C.aspect=GC.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();GC.updateProjectionMatrix();

  stops.forEach(([o,s])=>r.addColorStop(o,s));g.fillStyle=r;g.fillRect(0,0,n,n);return new THREE.CanvasTexture(c)}

{const sd=new THREE.Mesh(new THREE.CircleGeometry(16,32),new THREE.MeshBasicMaterial({color:0xfff7dc,fog:false,depthWrite:false}));

 for(const m of[halo,sd]){m.position.copy(SUN).multiplyScalar(390);m.lookAt(0,0,0);m.renderOrder=-1;sky.add(m)}}

S.add(new THREE.HemisphereLight(0xe4f0ff,0xc9b08a,.52));
const sun=new THREE.DirectionalLight(0xfff0da,.62);sun.position.copy(SUN).multiplyScalar(60);S.add(sun);

// =====================================================================
// 2. Materials: tinted toon ramp + shader patch (contact shading, rim, painted surface, wind)
// =====================================================================
// ramp: cool lavender shadow -> warm lit. Shadows are coloured, never grey.
const GRAD=new THREE.DataTexture(new Uint8Array([150,134,192,255,198,186,218,255,236,229,236,255,255,252,244,255]),4,1,THREE.RGBAFormat);
GRAD.minFilter=GRAD.magFilter=THREE.NearestFilter;GRAD.needsUpdate=true;
const U={t:{value:0}};
// aKind (per-vertex) picks a painted surface: 0 smooth, 1 plaster, 2 stone, 3 wood, 4 foliage
function patch(m,o={}){const rim=o.rim||0,sway=o.sway||0,ao=o.ao==null?1:o.ao,rimC=new THREE.Color(o.rimC||0xfff0d0);

      if(uSway>0.){float h=max(transformed.y,0.);float ph=uT*1.7+wp.x*.29+wp.z*.23;

      float k=floor(vKind+.5);vec3 q=vWP;float pt=0.;
      if(k==1.)pt=sin(q.x*1.4+sin(q.y*2.3+q.z))*sin(q.z*1.2+sin(q.x*1.9+q.y))*.06;
      else if(k==2.){pt=sin(q.x*3.1+sin(q.y*4.+q.z*2.))*sin(q.z*2.7+sin(q.x*3.3+q.y))*.08;
        pt-=step(.88,fract(sin(dot(floor(q*6.),vec3(12.9,78.2,37.7)))*43758.5))*.07;}
      else if(k==3.)pt=sin(q.y*10.+sin(q.x*3.+q.z*3.)*2.5)*.055;
      else if(k==4.)pt=sin(q.x*2.6+sin(q.y*3.1))*sin(q.z*2.4+sin(q.y*2.7+q.x))*.09;

      gl_FragColor.rgb*=mix(1.-.32*uAo,1.,smoothstep(0.,1.6,vWP.y));
      if(uRim>0.){float fr=1.-abs(dot(normal,normalize(vViewPosition)));gl_FragColor.rgb+=uRimC*smoothstep(.55,.95,fr)*uRim;}

  return m}
function toon(o={}){return patch(new THREE.MeshToonMaterial({color:o.color==null?0xffffff:o.color,gradientMap:GRAD,vertexColors:!!o.vc,map:o.map||null,
  transparent:!!o.transparent,opacity:o.opacity==null?1:o.opacity,fog:o.fog!==false,side:o.side||THREE.FrontSide,emissive:o.em||0}),o)}
// constant-thickness outlines (normal extrusion), used selectively: ink on gameplay things, soft line on cover, none on backdrop
const OLC={};
function olMat(c,w){const k=c+'_'+w;if(OLC[k])return OLC[k];const m=new THREE.MeshBasicMaterial({color:c,side:THREE.BackSide});
  m.onBeforeCompile=s=>{s.uniforms.uW={value:w};s.vertexShader='uniform float uW;\n'+s.vertexShader.replace('#include <begin_vertex>',
    '#include <begin_vertex>\nvec4 vp0=modelViewMatrix*vec4(transformed,1.);transformed+=normalize(normal)*uW*clamp(-vp0.z*.09,.6,2.6);')};
  return OLC[k]=m}

const MAT={t:toon({vc:1,rim:.12}),d:toon({vc:1,rim:.1,side:THREE.DoubleSide}),f:toon({vc:1,rim:.16,sway:.0011}),
  g:new THREE.MeshBasicMaterial({vertexColors:true}),b:toon({vc:1,fog:false,ao:0}),c:toon({vc:1,fog:false,ao:0,rim:.25,rimC:0xfff6e6})};

// =====================================================================
// 3. Shape kit: merge builder (vertex colours + surface kind), soft primitives
// =====================================================================
const _q=new THREE.Quaternion(),_e=new THREE.Euler(),_v=new THREE.Vector3(),_s=new THREE.Vector3();

  get m(){return this.st[this.st.length-1]}
  push(mat){this.st.push(this.m.clone().multiply(mat));return this}
  pop(){this.st.pop();return this}
  // col: hex, or fn(x,y,z,nx,ny,nz)->hex evaluated per triangle (crisp painted bands/spots)
  add(geo,col,mat,o={}){const g=geo.index?geo.toNonIndexed():geo.clone();const T=this.m.clone();if(mat)T.multiply(mat);g.applyMatrix4(T);
    const pa=g.attributes.position.array,na=g.attributes.normal.array,n=pa.length/3,ca=new Float32Array(n*3),c=new THREE.Color();
    if(typeof col==='function'){for(let i=0;i<n;i+=3){const j=i*3;
        const cx=(pa[j]+pa[j+3]+pa[j+6])/3,cy=(pa[j+1]+pa[j+4]+pa[j+7])/3,cz=(pa[j+2]+pa[j+5]+pa[j+8])/3;
        c.setHex(col(cx,cy,cz,(na[j]+na[j+3]+na[j+6])/3,(na[j+1]+na[j+4]+na[j+7])/3,(na[j+2]+na[j+5]+na[j+8])/3));
        for(let v=0;v<3;v++)ca.set([c.r,c.g,c.b],j+v*3)}}
    else{c.setHex(col);for(let i=0;i<n;i++)ca.set([c.r,c.g,c.b],i*3)}
    const b=o.b||'t';(this.parts[b]=this.parts[b]||[]).push({p:pa,n:na,c:ca,k:o.k||0});return this}
  geo(b='t'){const L=this.parts[b];if(!L)return null;let N=0;L.forEach(x=>N+=x.p.length);
    const pos=new Float32Array(N),nor=new Float32Array(N),col=new Float32Array(N),kind=new Float32Array(N/3);let o=0;
    for(const x of L){pos.set(x.p,o);nor.set(x.n,o);col.set(x.c,o);kind.fill(x.k,o/3,(o+x.p.length)/3);o+=x.p.length}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('normal',new THREE.BufferAttribute(nor,3));
    g.setAttribute('color',new THREE.BufferAttribute(col,3));g.setAttribute('aKind',new THREE.BufferAttribute(kind,1));g.computeBoundingSphere();return g}
  build(line){const grp=new THREE.Group();grp.meshes=[];
    for(const b in this.parts){const m=new THREE.Mesh(this.geo(b),MAT[b]);if(line&&b!=='g'&&b!=='f')ol(m,line,.022);grp.add(m);grp.meshes.push(m)}
    return grp}}
const sp=(r,w=16,h=12)=>new THREE.SphereGeometry(r,w,h);
const cyl=(a,b,h,s=14)=>new THREE.CylinderGeometry(a,b,h,s);
const cone=(r,h,s=12)=>new THREE.ConeGeometry(r,h,s);
const tor=(r,t,a=TAU,rs=8,ts=20)=>new THREE.TorusGeometry(r,t,rs,ts,a);
const lathe=(pts,s=18)=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),s);
const L=(pts,k)=>pts.map(([r,y])=>[r*k,y*k]);

function rbox(w,h,d,e=.3,seg=14){const g=new THREE.SphereGeometry(1,seg,Math.max(6,seg*.75|0)),p=g.attributes.position,f=v=>Math.sign(v)*Math.pow(Math.abs(v),e);

function bend(g,kx,kz=0){const p=g.attributes.position;for(let i=0;i<p.count;i++){const y=p.getY(i);p.setX(i,p.getX(i)+kx*y*y);p.setZ(i,p.getZ(i)+kz*y*y)}g.computeVertexNormals();return g}
function lumpy(g,a,f=2.2,s=0){const p=g.attributes.position,v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const l=v.length()||1,x=v.x/l,y=v.y/l,z=v.z/l;
    const n=Math.sin(x*f*1.7+s)*Math.sin(y*f*1.3+s*2.1)*Math.sin(z*f*1.9+s*.7)+.5*Math.sin(x*f*3.1-s)*Math.sin(z*f*2.7+s);v.multiplyScalar(1+a*n);p.setXYZ(i,v.x,v.y,v.z)}
  g.computeVertexNormals();return g}
function flatBottom(g,y0){const p=g.attributes.position;for(let i=0;i<p.count;i++)if(p.getY(i)<y0)p.setY(i,y0+(p.getY(i)-y0)*.08);g.computeVertexNormals();return g}

const PATHS=[

  [[0,4],[0,10],[0,16],[.6,24],[-1,32],[0,40],[2,62]],                  // south: spawn -> meadow

const SEG=[];PATHS.forEach(p=>{for(let i=0;i<p.length-1;i++)SEG.push([p[i],p[i+1]])});
function pathD(x,z){let d=1e9;for(const[[ax,az],[bx,bz]]of SEG){const dx=bx-ax,dz=bz-az,t=Math.max(0,Math.min(1,((x-ax)*dx+(z-az)*dz)/(dx*dx+dz*dz)));d=Math.min(d,Math.hypot(x-ax-dx*t,z-az-dz*t))}return d}

  const blot=(x,y,r,col,a)=>{const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col);gr.addColorStop(1,col.replace(/[\d.]+\)$/,'0)'));g.fillStyle=gr;g.globalAlpha=a;g.fillRect(x-r,y-r,2*r,2*r)};
  for(let i=0;i<260;i++)blot(rnd()*GCV,rnd()*GCV,40+rnd()*170,pick(['rgba(198,222,150,1)','rgba(132,176,106,1)','rgba(176,206,120,1)','rgba(150,190,140,1)']),.35);
  g.globalAlpha=1;g.lineCap='round';
  // painterly grass marks
  for(let i=0;i<9000;i++){const x=rnd()*GCV,y=rnd()*GCV,l=6+rnd()*12,a=-1.9+rnd()*.7;g.strokeStyle=pick(['#8fb86e','#94bf73','#b9d78f','#7fac66']);g.globalAlpha=.45;g.lineWidth=2+rnd()*1.5;
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5+3,y+Math.sin(a)*l*.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  g.globalAlpha=1;
  const strokeP=(pts,w,col,a=1)=>{g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=u2c(w);g.lineJoin='round';g.beginPath();g.moveTo(w2c(pts[0][0]),w2c(pts[0][1]));
    for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,mz=(pts[i][1]+pts[i+1][1])/2;g.quadraticCurveTo(w2c(pts[i][0]),w2c(pts[i][1]),w2c(mx),w2c(mz))}
    const l=pts[pts.length-1];g.lineTo(w2c(l[0]),w2c(l[1]));g.stroke();g.globalAlpha=1};
  // plaza rim first so paths flow into it
  const ring=(r,col)=>{g.fillStyle=col;g.beginPath();g.arc(w2c(0),w2c(0),u2c(r),0,TAU);g.fill()};
  ring(7.2,'rgba(140,170,105,.6)');
  PATHS.forEach(p=>strokeP(p,3.6,'#c69f74',.7));

  PATHS.forEach(p=>strokeP(p,1.1,'#f0d8ac',.7));
  ring(6.3,'#c9a37a');ring(5.9,'#ecd7b6');
  // cobbles: rings of soft rounded stones
  for(let r=1.9;r<5.8;r+=.62){const n=Math.floor(TAU*r/.7);for(let i=0;i<n;i++){const a=i/n*TAU+r,x=w2c(Math.cos(a)*r),y=w2c(Math.sin(a)*r);
    g.fillStyle=pick(['#f4e2c3','#ead2ae','#f7e8cc','#e3c8a6']);g.strokeStyle='#cdb08f';g.lineWidth=2;g.beginPath();g.ellipse(x,y,u2c(.3),u2c(.24),a,0,TAU);g.fill();g.stroke()}}
  // pebbles + footprints of history along paths
  for(let i=0;i<1400;i++){const s=pick(SEG),t=rnd(),x=s[0][0]+(s[1][0]-s[0][0])*t+rr(-1.3,1.3),z=s[0][1]+(s[1][1]-s[0][1])*t+rr(-1.3,1.3);
    g.fillStyle=pick(['#d2b083','#c9a678','#f3dfba']);g.globalAlpha=.8;g.beginPath();g.arc(w2c(x),w2c(z),2+rnd()*3,0,TAU);g.fill()}
  g.globalAlpha=1;
  // painted flower specks
  for(let i=0;i<420;i++){const x=rr(-80,80),z=rr(-80,80);if(pathD(x,z)<2||Math.hypot(x,z)<7)continue;const col=pick(['#fff6e6','#f6b8c6','#f6e08f','#d8c8f0']);
    for(let j=0;j<6;j++){g.fillStyle=col;g.beginPath();g.arc(w2c(x+rr(-1,1)),w2c(z+rr(-1,1)),2.5+rnd()*2,0,TAU);g.fill()}}
});
